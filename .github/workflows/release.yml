name: Release Notarized App

on:
  release:
    types:
      - published
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to build and upload to
        required: true

permissions:
  contents: write

jobs:
  version:
    name: Resolve Tag And Build Number
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.resolve.outputs.tag }}
      build_number: ${{ steps.resolve.outputs.build_number }}
    steps:
      - name: Resolve release tag and shared build number
        id: resolve
        env:
          RELEASE_EVENT_TAG: ${{ github.event.release.tag_name }}
          DISPATCH_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          TAG="${RELEASE_EVENT_TAG:-$DISPATCH_TAG}"
          if [[ -z "$TAG" ]]; then
            echo "Release tag is required." >&2
            exit 1
          fi
          # Dotted YYYYMMDD.HHMMSS: unique, monotonic, and each component stays
          # under Apple's 2^32-1 per-component limit. Shared by both platforms.
          BUILD_NUMBER="$(date -u +%Y%m%d.%H%M%S)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "build_number=$BUILD_NUMBER" >> "$GITHUB_OUTPUT"
          echo "Resolved tag=$TAG build_number=$BUILD_NUMBER"

  macos:
    name: Notarize And Upload Release Asset
    needs: version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Import Developer ID certificate
        id: signing
        env:
          P12_BASE64: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_BASE64 }}
          P12_PASSWORD: ${{ secrets.DEVELOPER_ID_APPLICATION_P12_PASSWORD }}
        run: |
          set -euo pipefail

          KEYCHAIN="$RUNNER_TEMP/nanokvm-signing.keychain-db"
          CERTIFICATE="$RUNNER_TEMP/developer-id-application.p12"

          echo "$P12_BASE64" | base64 --decode > "$CERTIFICATE"

          security create-keychain -p "" "$KEYCHAIN"
          security set-keychain-settings -lut 21600 "$KEYCHAIN"
          security unlock-keychain -p "" "$KEYCHAIN"
          security import "$CERTIFICATE" -k "$KEYCHAIN" -P "$P12_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security

          INTERMEDIATE="$RUNNER_TEMP/DeveloperIDG2CA.cer"
          curl -fsSL https://www.apple.com/certificateauthority/DeveloperIDG2CA.cer -o "$INTERMEDIATE"
          security import "$INTERMEDIATE" -k "$KEYCHAIN" -T /usr/bin/codesign -T /usr/bin/security

          security list-keychains -d user -s "$KEYCHAIN" login.keychain-db
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "" "$KEYCHAIN"
          security find-identity -v -p codesigning "$KEYCHAIN"
          echo "keychain=$KEYCHAIN" >> "$GITHUB_OUTPUT"

      - name: Store notarization credentials
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          NOTARY_APPLE_ID: ${{ secrets.NOTARY_APPLE_ID }}
          NOTARY_APP_PASSWORD: ${{ secrets.NOTARY_APP_PASSWORD }}
          NOTARY_PROFILE: KVMConsole-DeveloperID
        run: |
          xcrun notarytool store-credentials "$NOTARY_PROFILE" \
            --apple-id "$NOTARY_APPLE_ID" \
            --team-id "$APPLE_TEAM_ID" \
            --password "$NOTARY_APP_PASSWORD" \
            --keychain "${{ steps.signing.outputs.keychain }}"

      - name: Build, notarize, and staple
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
          FINAL_ZIP_PATH: build/developer-id/KVMConsole-${{ needs.version.outputs.tag }}-DeveloperID-notarized.zip
          NOTARY_KEYCHAIN: ${{ steps.signing.outputs.keychain }}
          NOTARY_PROFILE: KVMConsole-DeveloperID
          NOTARIZE: "1"
        run: Scripts/build-developer-id.sh

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v7
        with:
          name: KVMConsole-${{ needs.version.outputs.tag }}-DeveloperID-notarized
          path: build/developer-id/KVMConsole-${{ needs.version.outputs.tag }}-DeveloperID-notarized.zip
          if-no-files-found: error

      - name: Upload asset to GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ needs.version.outputs.tag }}
        run: |
          gh release upload "$RELEASE_TAG" \
            build/developer-id/KVMConsole-"$RELEASE_TAG"-DeveloperID-notarized.zip \
            --clobber

  ios:
    name: Upload iOS Build To TestFlight
    needs: version
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          ref: ${{ needs.version.outputs.tag }}

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Decode App Store Connect API key
        id: asc
        env:
          ASC_KEY_BASE64: ${{ secrets.APP_STORE_CONNECT_API_KEY_BASE64 }}
        run: |
          set -euo pipefail
          KEY_PATH="$RUNNER_TEMP/AuthKey.p8"
          echo "$ASC_KEY_BASE64" | base64 --decode > "$KEY_PATH"
          echo "key_path=$KEY_PATH" >> "$GITHUB_OUTPUT"

      - name: Build and upload to TestFlight
        env:
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          ASC_KEY_ID: ${{ secrets.APP_STORE_CONNECT_API_KEY_ID }}
          ASC_ISSUER_ID: ${{ secrets.APP_STORE_CONNECT_API_ISSUER_ID }}
          ASC_KEY_PATH: ${{ steps.asc.outputs.key_path }}
          BUILD_NUMBER: ${{ needs.version.outputs.build_number }}
        run: Scripts/build-testflight.sh
