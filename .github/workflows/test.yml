name: Test

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

# Pinned XcodeGen release. We download the prebuilt binary instead of
# `brew install xcodegen`, which spends ~2 min in Homebrew overhead per job.
env:
  XCODEGEN_VERSION: "2.45.4"

jobs:
  package:
    name: Package Tests (KVMCore)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain version
        run: echo "TOOLCHAIN_KEY=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Cache SwiftPM build
        uses: actions/cache@v4
        with:
          path: KVMCore/.build
          key: spm-${{ runner.os }}-${{ env.TOOLCHAIN_KEY }}-${{ hashFiles('KVMCore/Package.swift', 'KVMCore/Sources/**', 'KVMCore/Tests/**') }}
          restore-keys: |
            spm-${{ runner.os }}-${{ env.TOOLCHAIN_KEY }}-

      - name: Run package tests
        run: swift test --package-path KVMCore

  macos:
    name: macOS Tests (KVMConsole)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Toolchain version
        run: echo "TOOLCHAIN_KEY=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: dd-macos-${{ runner.os }}-${{ env.TOOLCHAIN_KEY }}-${{ hashFiles('project.yml', 'KVMCore/Sources/**', 'KVMConsole/**') }}
          restore-keys: |
            dd-macos-${{ runner.os }}-${{ env.TOOLCHAIN_KEY }}-

      - name: Run macOS tests
        run: |
          xcodebuild test \
            -project KVMConsole.xcodeproj \
            -scheme KVMConsole \
            -destination 'platform=macOS' \
            -derivedDataPath ./DerivedData \
            -quiet \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=

  ipad:
    name: iPadOS Tests (KVMConsoleiPad)
    runs-on: macos-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Boot simulator
        # Kick off the simulator boot now so it warms up in parallel with the
        # XcodeGen install and the app build below; simctl returns immediately
        # and the device finishes booting off the critical path.
        run: xcrun simctl boot 'iPad Pro 11-inch (M5)' || true

      - name: Toolchain version
        run: echo "TOOLCHAIN_KEY=$(xcodebuild -version | shasum | cut -c1-12)" >> "$GITHUB_ENV"

      - name: Install XcodeGen
        run: |
          curl -fsSL "https://github.com/yonaskolb/XcodeGen/releases/download/${XCODEGEN_VERSION}/xcodegen.zip" -o /tmp/xcodegen.zip
          unzip -q /tmp/xcodegen.zip -d /tmp/xcodegen-dist
          echo "/tmp/xcodegen-dist/xcodegen/bin" >> "$GITHUB_PATH"

      - name: Generate Xcode project
        run: xcodegen generate

      - name: Cache DerivedData
        uses: actions/cache@v4
        with:
          path: DerivedData
          key: dd-ipad-${{ runner.os }}-${{ env.TOOLCHAIN_KEY }}-${{ hashFiles('project.yml', 'KVMCore/Sources/**', 'KVMConsoleiPad/**') }}
          restore-keys: |
            dd-ipad-${{ runner.os }}-${{ env.TOOLCHAIN_KEY }}-

      - name: Run iPadOS tests
        run: |
          xcodebuild test \
            -project KVMConsole.xcodeproj \
            -scheme KVMConsoleiPad \
            -destination 'platform=iOS Simulator,name=iPad Pro 11-inch (M5)' \
            -derivedDataPath ./DerivedData \
            -quiet \
            -skipPackagePluginValidation \
            -skipMacroValidation \
            COMPILER_INDEX_STORE_ENABLE=NO \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY= \
            DEVELOPMENT_TEAM=
